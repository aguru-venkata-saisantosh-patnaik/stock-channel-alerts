name: scan

on:
  schedule:
    # every 10 minutes, Mon–Fri, 13:00–21:59 UTC. Covers NYSE hours in summer and winter;
    # the script itself skips runs outside trading hours and on market holidays.
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Scan even if the market is closed"
        type: boolean
        default: true
      test_alerts:
        description: "Send a test message to every configured alert channel"
        type: boolean
        default: false
      simulate:
        description: "Health-check drill: 'stale' pretends prices are 3 days old (expect a red health bar + one failure alert; the next normal run sends an all-clear)"
        type: choice
        options: [none, stale]
        default: none

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m tests.test_engine

      - name: Test alert channels
        if: github.event_name == 'workflow_dispatch' && inputs.test_alerts
        run: python -m engine.notify --test

      - name: Restore last state and watchlist from gh-pages
        run: |
          mkdir -p out
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            for f in state.json universe.json my_tickers.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
          fi

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Scan
        id: scan
        run: |
          echo "stamp_before=$(cat .cache/prices.day 2>/dev/null)" >> "$GITHUB_OUTPUT"
          python -m engine.run --out out \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.simulate == 'stale') && '--simulate stale' || '' }}
          echo "stamp_after=$(cat .cache/prices.day 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Save price cache (once per day, after the full download)
        if: steps.scan.outputs.scanned == 'true' && steps.scan.outputs.stamp_before != steps.scan.outputs.stamp_after
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: prices-${{ github.run_id }}

      - name: Publish dashboard to gh-pages
        if: steps.scan.outputs.scanned == 'true'
        run: |
          cp site/* out/
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "scan $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
